[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-assistant"
version = "0.1.0"
description = "Law office daily-ops automation CLI (invoices, scans, weekly summary) around lark-cli"
requires-python = ">=3.9"
dependencies = [
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
pdf = ["pymupdf>=1.23"]

[project.scripts]
legal-assistant = "legal_assistant.cli:main"

# 代码平铺在 scripts/ 下，映射为 legal_assistant 包（无嵌套目录）
[tool.setuptools]
packages = ["legal_assistant"]

[tool.setuptools.package-dir]
legal_assistant = "scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
